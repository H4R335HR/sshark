# /etc/dnsmasq.d/surf.conf — DNS forwarder for opted-in clients.
# Clients use the gateway as DNS; queries go to Surfshark through the tunnel.
listen-address=192.168.1.50        # the gateway's LAN IP
bind-dynamic                       # not bind-interfaces: survives DHCP being late at boot
no-resolv
# Surfshark resolvers (the DNS = line of your downloaded config). The ONE place to change them.
server=162.252.172.57
server=149.154.159.92
# Local names still answered by your router (adjust domain and router IP)
server=/lan/192.168.1.1
cache-size=1000
